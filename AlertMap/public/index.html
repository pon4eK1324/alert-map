<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json">
<title>AlertMap — тривоги в Україні</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#141414;--fg:#eee;--mut:#999;--red:#ff3b3b}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
#map{position:absolute;inset:0;background:#0d0d0d}
.box{position:absolute;z-index:1000;background:rgba(20,20,20,.92);border:1px solid #333;border-radius:12px;padding:10px 12px;backdrop-filter:blur(6px)}
#top{top:calc(10px + env(safe-area-inset-top));left:10px;max-width:340px}
#top b{font-size:16px}#cnt{margin-top:4px}#src{color:var(--mut);font-size:12px;margin-top:4px}
#leg{margin-top:6px;font-size:12px;color:var(--mut);line-height:1.6}
#bar{bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 20px))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select{background:#2a2a2a;color:var(--fg);border:1px solid #444;border-radius:8px;padding:8px 12px;font:inherit}
button.on{background:var(--red);border-color:var(--red)}
#rp{display:none;margin-top:8px}#rp.show{display:block}
#sl{flex:1;min-width:140px;width:100%;margin-top:6px}#tl{font-weight:600;margin-left:auto}
.alert{animation:p 1.4s infinite}@keyframes p{50%{fill-opacity:.25}}
.thr{font-size:20px;text-shadow:0 0 6px #000;text-align:center;line-height:24px}
@media(max-width:600px){#top{right:10px;max-width:none}#leg{display:none}button,select{padding:10px}}
</style></head><body>
<div id="map"></div>
<div id="top" class="box"><b>🇺🇦 AlertMap</b><div id="cnt">Завантаження…</div>
<div id="leg">🛩 шахеди/БпЛА &nbsp; 🚀 ракети &nbsp; ☄️ балістика</div><div id="src"></div></div>
<div id="bar" class="box">
 <div class="row"><button id="bl" class="on">● Наживо</button><button id="br">⏪ Таймлапс</button><span id="tl"></span></div>
 <div id="rp"><div class="row">
  <button id="pl">▶</button>
  <select id="hr"><option value="6">6 год</option><option value="12">12 год</option><option value="24" selected>24 год</option><option value="48">48 год</option></select>
  <select id="sp"><option value="60">60×</option><option value="300" selected>300×</option><option value="900">900×</option><option value="1800">1800×</option></select>
 </div><input id="sl" type="range" step="60000"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id), WIN=30*60e3, KYIV='м. Київ';
const ICON={shahed:['🛩️','#ffa600'],missile:['🚀','#c26bff'],ballistic:['☄️','#ff3b3b']};
const map=L.map('map',{minZoom:5,maxZoom:12}).setView([48.7,31.3],6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO'}).addTo(map);
const base={color:'#667',weight:1,fillColor:'#222',fillOpacity:.35}, hot={color:'#ff5555',weight:2,fillColor:'#e11',fillOpacity:.6};
const layers={}, tg=L.layerGroup().addTo(map);
let kyiv, snaps=[], threats=[], liveAlerts=[], mode='live', T=Date.now(), from, play=null;
const fmt=t=>new Date(t).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const alertsAt=t=>{let a=[];for(const s of snaps){if(s.t<=t)a=s.a;else break}return a};

function paint(list){
  const s=new Set(list);
  for(const n in layers){const l=layers[n],on=s.has(n);l.setStyle(on?hot:base);l.getElement()?.classList.toggle('alert',on)}
  const k=s.has(KYIV);kyiv.setStyle(k?hot:{color:'#667',fillColor:'#222'});kyiv.setRadius(k?11:7);
  const n=list.length;$('cnt').innerHTML=n?`🔴 Тривога: <b>${n}</b> ${n==1?'регіон':'регіонів'}`:'🟢 Тривог немає';
}
function drawThreats(t){
  tg.clearLayers();
  for(const h of threats){
    if(h.t>t||t-h.t>WIN)continue;
    const [e,c]=ICON[h.type],o=1-0.7*(t-h.t)/WIN,last=h.pts[h.pts.length-1];
    if(h.pts.length>1)L.polyline(h.pts,{color:c,weight:2,dashArray:'6 6',opacity:o}).addTo(tg);
    L.marker(last,{icon:L.divIcon({className:'',html:`<div class="thr" style="opacity:${o}">${e}</div>`,iconSize:[24,24]})})
      .bindPopup(`<b>${fmt(h.t)}</b><br>${h.text.replace(/</g,'&lt;')}`).addTo(tg);
  }
}
function render(){
  $('tl').textContent=fmt(T);
  paint(mode==='live'?liveAlerts:alertsAt(T));drawThreats(T);
}
async function live(){
  if(mode!=='live')return;
  try{const s=await (await fetch('/api/state')).json();
    liveAlerts=s.alerts;threats=s.threats;T=s.now;$('src').textContent='Джерело: '+s.source;render();
  }catch(e){$('src').textContent='Немає зв’язку із сервером'}
}
async function loadHistory(){
  const h=await (await fetch('/api/history?hours='+$('hr').value)).json();
  snaps=h.snaps;threats=h.threats;from=h.from;
  const sl=$('sl');sl.min=from;sl.max=h.now;sl.value=from;T=from;$('src').textContent='Джерело: '+h.source;render();
}
function stop(){clearInterval(play);play=null;$('pl').textContent='▶'}
function setMode(m){
  mode=m;stop();$('bl').classList.toggle('on',m==='live');$('br').classList.toggle('on',m==='replay');
  $('rp').classList.toggle('show',m==='replay');m==='live'?live():loadHistory();
}
$('bl').onclick=()=>setMode('live');$('br').onclick=()=>setMode('replay');$('hr').onchange=loadHistory;
$('sl').oninput=e=>{T=+e.target.value;render()};
$('pl').onclick=()=>{
  if(play)return stop();
  if(T>=+$('sl').max-1000)T=+$('sl').min;
  $('pl').textContent='⏸';
  play=setInterval(()=>{T+=$('sp').value*100;const mx=+$('sl').max;if(T>=mx){T=mx;stop()}$('sl').value=T;render()},100);
};
fetch('oblasts.json').then(r=>r.json()).then(g=>{
  L.geoJSON(g,{style:base,onEachFeature:(f,l)=>{layers[f.properties.name]=l;l.bindTooltip(f.properties.name,{sticky:true})}}).addTo(map);
  kyiv=L.circleMarker([50.45,30.52],{radius:7,weight:2,fillOpacity:.8}).bindTooltip(KYIV).addTo(map);
  live();setInterval(live,20000);
});
</script></body></html>
